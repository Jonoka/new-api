name: Hermes Build Docker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag suffix (default: hermes-<short-sha>)'
        required: false
        type: string
      push_latest:
        description: 'Also update ghcr.io/<repo>:hermes-latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build_amd64:
    name: Build & push amd64
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newapi_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newapi_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql_ci_only
          MYSQL_DATABASE: newapi_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql_ci_only"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge diff
        run: |
          merge_commit="$(git log --merges -1 --format=%H)"
          test -n "$merge_commit"
          git diff --check "${merge_commit}^1" HEAD

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check changed Go formatting
        id: go_format
        continue-on-error: true
        run: |
          base="$(git merge-base origin/custom-main HEAD)"
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACM -z "$base" HEAD -- '*.go')
          if [ "${#files[@]}" -gt 0 ]; then
            gofmt -w "${files[@]}"
          fi
          git diff --binary > "$RUNNER_TEMP/go-format.patch"
          git diff --exit-code

      - name: Upload formatting correction
        if: steps.go_format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: go-format-correction
          path: ${{ runner.temp }}/go-format.patch
          if-no-files-found: ignore

      - name: Check B accounting before frontend builds
        env:
          NEW_API_TEST_REDIS_ADDR: 127.0.0.1:6379
          NEW_API_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/newapi_test_ci?sslmode=disable
          NEW_API_TEST_MYSQL_DSN: root:mysql_ci_only@tcp(127.0.0.1:3306)/newapi_test_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: go test ./model ./service ./controller ./relay ./relay/helper -run 'Test(ReconcileGroupReservation|BillingSession|FinalGroup|TaskAccounting|TaskSubmission|AsyncTask|TaskBilling|UserCacheGeneration)' -count=1

      - name: Check C Alpha and replay before frontend builds
        env:
          NEW_API_TEST_REDIS_ADDR: 127.0.0.1:6379
          NEW_API_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/newapi_test_ci?sslmode=disable
          NEW_API_TEST_MYSQL_DSN: root:mysql_ci_only@tcp(127.0.0.1:3306)/newapi_test_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: >-
          go test ./common ./relay/common ./relay/channel/... ./relay ./service ./controller ./router
          -run 'Alpha|Replay|MemoryStorage|DiskStorage|Outbound|BodyFactory|BodyMetadata|ResetUpstream' -count=1

      - name: Check D wallet concurrency before frontend builds
        env:
          NEW_API_TEST_REDIS_ADDR: 127.0.0.1:6379
          NEW_API_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/newapi_test_ci?sslmode=disable
          NEW_API_TEST_MYSQL_DSN: root:mysql_ci_only@tcp(127.0.0.1:3306)/newapi_test_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: go test ./model ./service ./controller ./relay ./relay/channel/openai -run 'Wallet|Midjourney|Realtime|QuotaCache|Balance|BillingSession' -count=1

      - name: Check and build default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun test src/features/pricing/lib/time-rule-expr.test.mjs src/features/system-settings/models/tiered-pricing-editor.test.mjs
          bun run typecheck
          bun x eslint src/features/pricing/lib/billing-expr.ts src/features/system-settings/models/tiered-pricing-editor.tsx src/features/system-settings/models/model-pricing-sheet.tsx src/features/system-settings/models/model-ratio-visual-editor.tsx src/features/system-settings/models/model-ratio-form.tsx src/features/channels/components/dialogs/channel-test-dialog.tsx
          bun run build

      - name: Check and build classic frontend
        working-directory: web/classic
        run: |
          bun install --frozen-lockfile
          bun test src/pages/Setting/Ratio/components/tiered-pricing-editor.test.mjs
          bun run build

      - name: Run Go tests
        env:
          NEW_API_TEST_REDIS_ADDR: 127.0.0.1:6379
          NEW_API_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/newapi_test_ci?sslmode=disable
          NEW_API_TEST_MYSQL_DSN: root:mysql_ci_only@tcp(127.0.0.1:3306)/newapi_test_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: go test ./... -count=1

      - name: Race-check upgraded boundaries
        env:
          NEW_API_TEST_REDIS_ADDR: 127.0.0.1:6379
          NEW_API_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/newapi_test_ci?sslmode=disable
          NEW_API_TEST_MYSQL_DSN: root:mysql_ci_only@tcp(127.0.0.1:3306)/newapi_test_ci?charset=utf8mb4&parseTime=True&loc=Local
        run: >-
          go test -race ./common ./relay/common ./relay/channel ./model ./service ./controller ./middleware ./relay ./relay/helper
          -run 'Wallet|Midjourney|Realtime|QuotaCache|Balance|Alpha|Replay|MemoryStorage|DiskStorage|Outbound|BodyFactory|BodyMetadata|ResetUpstream|Test(RelayResponseHeaderTimeout|RelayTransportsApplyResponseHeaderTimeout|ResponseHeaderTimeout|RelayRequestParseError|RelayRejectsMalformedRequest|RelayRejectsNonObjectRequest|RelayPreservesRequestBodyTooLarge|UserCriticalRateLimit|FormatUserLogsUsesStrictProjection|ProjectUserLogOther|UserAndTokenReadsProject|SumUsedQuotaKeepsHistorical|SanitizeDBError|SanitizedGormWriter|GormLoggerRedacts|ReconcileGroupReservation|BillingSession|ModelPriceHelper|RelayTaskSubmit|FinalGroup|TaskAccounting|TaskSubmission|AsyncTask|TaskBilling|CanvasImageTask|ImageTask|UserCacheGeneration)'
          -count=1

      - name: Require committed Go formatting before publishing
        if: steps.go_format.outcome != 'success'
        run: exit 1

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag='${{ inputs.image_tag }}'
          if [ -z "$tag" ]; then
            tag="hermes-${GITHUB_SHA::12}"
          fi
          {
            echo "image=ghcr.io/${repo}:${tag}"
            echo "tags<<EOF"
            echo "ghcr.io/${repo}:${tag}"
            if [ '${{ inputs.push_latest }}' = 'true' ]; then
              echo "ghcr.io/${repo}:hermes-latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "${tag}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build & push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CANVAS_LAUNCHER_CACHE_KEY=${{ hashFiles('web/default/src/features/canvas/lib.ts', 'web/classic/src/helpers/canvas.js') }}
          provenance: false
          sbom: false

      - name: Rehearse candidate startup twice
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/batch-a-smoke.sh

      - name: Seed interrupted task accounting
        env:
          NEW_API_TEST_COMPATIBILITY_DSN: postgres://postgres:postgres@localhost:5432/newapi_candidate_smoke?sslmode=disable
        run: go test ./model -run '^TestTaskAccountingCompatibilitySeed$' -count=1

      - name: Rehearse B recovery and drained previous image
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          PREVIOUS_IMAGE: ghcr.io/jonoka/new-api@sha256:d666f0ea0b945f01ffa559a6a594545f3067b5b5d32f0fe00da5ab8cfe07eec6
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/batch-b-smoke.sh

      - name: Seed candidate Alpha fixture
        env:
          NEW_API_TEST_COMPATIBILITY_DSN: postgres://postgres:postgres@localhost:5432/newapi_candidate_smoke?sslmode=disable
        run: go test ./model -run '^TestAlphaSearchCompatibilitySeed$' -count=1

      - name: Rehearse candidate Alpha through a mock gateway
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          PREVIOUS_IMAGE: ghcr.io/jonoka/new-api@sha256:e3964616b77d4dfdd2d5daa2356be45d33d1a83ddbc25a87a0e87677fd6d35e9
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/batch-c-smoke.sh

      - name: Seed D concurrency fixtures
        env:
          NEW_API_TEST_COMPATIBILITY_DSN: postgres://postgres:postgres@localhost:5432/newapi_candidate_smoke?sslmode=disable
        run: go test ./model -run '^TestWalletConcurrencyCompatibilitySeed$' -count=1

      - name: Rehearse D multi-process admission and restart
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          PREVIOUS_IMAGE: ghcr.io/jonoka/new-api@sha256:7fb3ebb45298b502c4c3c232bb632346f01410ce7ad9a6b46452b4c4384693ec
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: bash scripts/ci/batch-d-smoke.sh

      - name: Summary
        run: |
          echo "### Hermes image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.tags.outputs.image }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

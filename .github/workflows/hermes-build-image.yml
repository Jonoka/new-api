name: Hermes Build Docker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag suffix (default: hermes-<short-sha>)'
        required: false
        type: string
      push_latest:
        description: 'Also update ghcr.io/<repo>:hermes-latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build_amd64:
    name: Build & push amd64
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newapi_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newapi_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge diff
        run: |
          merge_commit="$(git log --merges -1 --format=%H)"
          test -n "$merge_commit"
          git diff --check "${merge_commit}^1" HEAD

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format changed Go source
        run: |
          git diff --name-only -z --diff-filter=ACM origin/custom-main...HEAD -- '*.go' | xargs -0 -r gofmt -w
          git diff --binary -- '*.go' > "$RUNNER_TEMP/source-format.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: source-format-${{ github.sha }}
          path: ${{ runner.temp }}/source-format.patch

      - name: Check and build default frontend
        working-directory: web/default
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test src/features/canvas/lib.test.ts src/features/canvas/sso.test.ts
          bun run build

      - name: Check and build classic frontend
        working-directory: web/classic
        run: |
          bun install --frozen-lockfile
          bun test src/classic-canvas-integration.test.mjs src/canvas-sso.test.mjs
          bun run build

      - name: Run Go tests
        env:
          NEW_API_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/newapi_test_ci?sslmode=disable
          NEW_API_TEST_REDIS_URL: redis://localhost:6379/15
        run: go test ./... -count=1

      - name: Check canvas SSO races
        env:
          NEW_API_TEST_REDIS_URL: redis://localhost:6379/15
        run: go test -race ./controller -run TestCanvasAuth -count=1

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag='${{ inputs.image_tag }}'
          if [ -z "$tag" ]; then
            tag="hermes-${GITHUB_SHA::12}"
          fi
          {
            echo "image=ghcr.io/${repo}:${tag}"
            echo "tags<<EOF"
            echo "ghcr.io/${repo}:${tag}"
            if [ '${{ inputs.push_latest }}' = 'true' ]; then
              echo "ghcr.io/${repo}:hermes-latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "${tag}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CANVAS_LAUNCHER_CACHE_KEY=${{ hashFiles('web/default/src/features/canvas/lib.ts', 'web/classic/src/helpers/canvas.js') }}
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "### Hermes image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.tags.outputs.image }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

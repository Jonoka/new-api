<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OKX 支付宝汇率</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #2563eb;
        --danger: #b91c1c;
        --ok: #047857;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --panel: #1f2937;
          --text: #f9fafb;
          --muted: #9ca3af;
          --border: #374151;
          --primary: #60a5fa;
          --danger: #fca5a5;
          --ok: #6ee7b7;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(960px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 20px;
      }

      .header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.3;
      }

      p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      button {
        min-width: 110px;
        height: 36px;
        border: 1px solid var(--primary);
        border-radius: 6px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .item {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        min-height: 84px;
      }

      .label {
        color: var(--muted);
        font-size: 12px;
      }

      .value {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 650;
        word-break: break-word;
      }

      .status {
        margin-top: 16px;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .status.error {
        color: var(--danger);
      }

      .status.ok {
        color: var(--ok);
      }

      .config {
        margin-top: 20px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }

      code {
        background: color-mix(in srgb, var(--border) 45%, transparent);
        border-radius: 4px;
        padding: 2px 5px;
      }

      @media (max-width: 760px) {
        .header {
          display: block;
        }

        button {
          width: 100%;
          margin-top: 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="header">
          <div>
            <h1>OKX 支付宝汇率</h1>
            <p>
              读取主程序 OKPay 已保存配置，预览 OKX 支付宝档位原始价格和调价后的实际结算汇率。
            </p>
          </div>
          <button id="refreshButton" type="button">刷新</button>
        </div>

        <div id="status" class="status">正在加载...</div>

        <div class="grid" aria-live="polite">
          <div class="item">
            <div class="label">调价后汇率</div>
            <div id="adjustedRate" class="value">--</div>
          </div>
          <div class="item">
            <div class="label">OKX 原始价格</div>
            <div id="rawRate" class="value">--</div>
          </div>
          <div class="item">
            <div class="label">来源</div>
            <div id="source" class="value">--</div>
          </div>
        </div>

        <div class="config">
          <p>
            当前档位：<code id="tier">--</code>
            方向：<code id="side">--</code>
            调价：<code id="adjustment">--</code>
          </p>
          <p>
            修改配置请到 <code>系统设置 - 支付设置 - OKPay Gateway</code> 保存后再刷新。
          </p>
        </div>
      </section>
    </main>

    <script>
      const state = {
        refreshButton: document.getElementById('refreshButton'),
        status: document.getElementById('status'),
        adjustedRate: document.getElementById('adjustedRate'),
        rawRate: document.getElementById('rawRate'),
        source: document.getElementById('source'),
        tier: document.getElementById('tier'),
        side: document.getElementById('side'),
        adjustment: document.getElementById('adjustment'),
      };

      function setStatus(message, type) {
        state.status.textContent = message;
        state.status.className = `status ${type || ''}`.trim();
      }

      function setText(node, value) {
        node.textContent = value === undefined || value === null || value === '' ? '--' : String(value);
      }

      function getUserId() {
        const direct = localStorage.getItem('uid');
        if (direct) return direct;
        try {
          const user = JSON.parse(localStorage.getItem('user') || '{}');
          return user.id ? String(user.id) : '';
        } catch (error) {
          return '';
        }
      }

      async function fetchJson(url) {
        const headers = { Accept: 'application/json' };
        const uid = getUserId();
        if (uid) {
          headers['New-Api-User'] = uid;
        }
        const response = await fetch(url, {
          credentials: 'same-origin',
          headers,
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || `HTTP ${response.status}`);
        }
        return payload;
      }

      async function refresh() {
        state.refreshButton.disabled = true;
        setStatus('正在获取已保存汇率配置...', '');
        try {
          const payload = await fetchJson('/api/option/okpay/rate-preview');
          const data = payload.data || {};
          setText(state.adjustedRate, data.adjusted_rate ? `${data.adjusted_rate} CNY/USDT` : '');
          setText(state.rawRate, data.raw_rate ? `${data.raw_rate} CNY/USDT` : '');
          setText(state.source, data.source);
          setText(state.tier, data.tier || '');
          setText(state.side, data.side || '');
          setText(
            state.adjustment,
            `${data.adjustment_type || 'absolute'} ${data.adjustment || 0}`,
          );
          setStatus('汇率预览已更新。', 'ok');
        } catch (error) {
          setStatus(error.message || '获取汇率失败', 'error');
        } finally {
          state.refreshButton.disabled = false;
        }
      }

      state.refreshButton.addEventListener('click', refresh);
      refresh();
    </script>
  </body>
</html>
